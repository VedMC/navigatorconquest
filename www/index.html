<!DOCTYPE html>
<html lang="sr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Navigator Conquest</title>
<style>
:root{--bg:#030a06;--p:#07140d;--l:#15402a;--t:#b8ffd2;--m:#5f9a78;--a:#35ff8a;--b:#3b9cff;--r:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 "Courier New",monospace;padding:14px;min-height:100vh}
main{max-width:460px;margin:auto}
h1{font-size:15px;letter-spacing:.08em;margin:0 0 8px;color:var(--a)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.top .row{flex:0;display:flex;gap:6px}
.sub{color:var(--m);font-size:13px;margin:4px 0 8px}
.stat{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.stat small{font-weight:400;color:var(--m)}
.bl{color:var(--b)}.rd{color:var(--r)}
.card{background:var(--p);border:1px solid var(--l);border-left:4px solid var(--a);padding:14px;margin-bottom:12px}
.big{font-size:48px;font-weight:700;letter-spacing:.1em}
button{width:100%;margin:0 0 10px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;background:var(--a);color:#02130a;border:0;border-radius:2px}
button.g{background:transparent;color:var(--t);border:1px solid var(--l)}
button.bl{background:var(--b);color:#031225}button.rd{background:var(--r);color:#2a0505}
.top button{width:auto;padding:8px 12px;margin:0}
.row2{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--l);font-size:14px}
input,select{width:100%;margin:0 0 10px;padding:14px;font-size:17px;font-family:inherit;background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:2px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
video{width:100%;background:#000;margin-bottom:12px}
.c{text-align:center}.err{color:var(--r)}
#mp svg{width:100%;height:auto;max-height:62vh;display:block;margin-bottom:10px}
.fl{stroke-width:3;stroke-dasharray:8 8;animation:fl .6s linear infinite}
@keyframes fl{to{stroke-dashoffset:-16}}
.sw{transform-origin:180px 310px;animation:sw 5s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.rip{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:rp 1.8s ease-out infinite;opacity:0}
@keyframes rp{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.ban{background:var(--a);color:#02130a;text-align:center;font-weight:700;font-size:20px;padding:12px;margin-bottom:8px}
</style></head>
<body><main id="v"></main>
<script src="jsQR.js"></script>
<script src="app.js"></script>
</body></html>
